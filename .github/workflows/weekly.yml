name: 털어드림 격주 통합 리포트 (금요일)

# 매주 금요일 08:47 KST = 매주 목요일 23:47 UTC
#   (2026-08-06 대표님 요청: 08:42 → 08:47. 같은 날 Recent 금 08:42 로 먼저 실행되며
#    Standard 는 5분 뒤 08:47 트리거되지만 concurrency group teoldeurim-mailer 로 큐 대기 →
#    Recent 완료 후 순차 실행. 실제 시작은 Recent 완료 직후.)
# ISO 홀수 주차에서만 실행 (격주)
# → send_report.py --mode=friday 가 benchmark → weekly → 통합 shell → 발송 전체를 관장.
on:
  schedule:
    - cron: '47 23 * * 4'   # 목요일 23:47 UTC = 금요일 08:47 KST
  workflow_dispatch:
    inputs:
      force_rescan:
        description: '강제 재분석 (오늘자 history 무시하고 새로 수집·분석)'
        type: boolean
        default: false
      report_date:
        description: '(선택) 리포트 slot 날짜 override — YYYY-MM-DD. 비면 실행 당일 KST. 예: 2026-07-17 (금요일 발송 예정이었으나 놓친 날짜 재발송용). 파일명·subject·history namespace 만 이 값으로 저장되며, age 계산·수집·generated_at 은 실제 실행 시각(KST 오늘) 유지.'
        type: string
        required: false
        default: ''
      notice:
        description: '(선택) 메일 본문 최상단 안내 문구. 리터럴 "\n" 은 개행으로 변환. HTML escape 후 안내 박스로 노출. 빈 값이면 미노출.'
        type: string
        required: false
        default: ''
      reissue:
        description: '(선택) subject 맨 앞에 "[재발송] " 접두어 추가'
        type: boolean
        default: false

# 동시 실행 방지 — monday_recent.yml 과 같은 group 을 공유해 push race 완전 회피.
# (2026-07-21: 월·수·금 recent 확장 대응. 조건·일정·판정은 일체 변경 없음.)
concurrency:
  group: teoldeurim-mailer
  cancel-in-progress: false

jobs:
  send-friday-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # benchmark ~7분 + weekly ~4분 + shell 조립·발송 ~1분 + 안전 마진

    permissions:
      contents: write   # history/, benchmark/history/sent/ 커밋 권한

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 격주 판별 — KST 금요일 기준 ISO 주차로 홀수/짝수 판단
      # - 홀수 주차: 발송 (run=1)
      # - 짝수 주차: 스킵 (run="")
      # - 단, workflow_dispatch (수동 실행)은 항상 통과
      # ============================================================
      - name: 격주 판별 (KST ISO 주차)
        id: biweekly
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "✅ 수동 실행 (workflow_dispatch) — 격주 스킵 무시하고 진행"
          else
            week=$(TZ=Asia/Seoul date +%V)
            echo "현재 KST ISO 주차: $week"
            if [ $((10#$week % 2)) -eq 1 ]; then
              echo "run=1" >> "$GITHUB_OUTPUT"
              echo "✅ 홀수 주차 ($week) — 격주 발송일"
            else
              echo "run=" >> "$GITHUB_OUTPUT"
              echo "⏭️  짝수 주차 ($week) — 격주 스킵 (다음 주 발송)"
            fi
          fi

      # ============================================================
      # 시크릿 사전 검증
      # ============================================================
      - name: 시크릿 사전 검증
        if: steps.biweekly.outputs.run == '1'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set -e
          fail=0
          check() {
            if [ "$2" -eq 0 ]; then echo "❌ $1: 등록 안 됨"; fail=1
            else echo "✅ $1: 등록됨 (길이 $2)"; fi
          }
          check YOUTUBE_API_KEY ${#YOUTUBE_API_KEY}
          check APIFY_TOKEN ${#APIFY_TOKEN}
          check ANTHROPIC_API_KEY ${#ANTHROPIC_API_KEY}
          check GMAIL_ADDRESS ${#GMAIL_ADDRESS}
          check GMAIL_APP_PASSWORD ${#GMAIL_APP_PASSWORD}
          check RECIPIENT_EMAIL ${#RECIPIENT_EMAIL}
          if [ $fail -eq 1 ]; then
            echo ""
            echo "👉 GitHub 레포의 Settings → Secrets and variables → Actions"
            echo "   에서 위 6개 시크릿이 정확한 이름으로 등록됐는지 확인하세요."
            exit 1
          fi

      # ============================================================
      # orchestrator 실행 (mode=friday)
      # → 내부에서 benchmark(먼저) + weekly 순서로 subprocess 실행
      #   weekly.py는 SEND_EMAIL_DISABLED=1 상태로 실행되므로 자체 발송 없음
      #   history/YYYY-MM-DD.json은 weekly.py가 정상 저장 (기존 정책 유지)
      # → 발송 성공 후:
      #     · benchmark/history/sent/YYYY-MM-DD_standard.json 자동 생성
      # ============================================================
      - name: 오케스트레이터 실행 (mode=friday)
        if: steps.biweekly.outputs.run == '1'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_RESCAN: ${{ github.event.inputs.force_rescan == 'true' && '1' || '' }}
          # REPORT_DATE / NOTICE / REISSUE — workflow_dispatch 로 넘어온 값. cron / 기본 실행은 모두 빈 값 → 기존 동작.
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
          NOTICE: ${{ github.event.inputs.notice || '' }}
          REISSUE: ${{ github.event.inputs.reissue == 'true' && '1' || '' }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/send_report.py --mode=friday

      # ============================================================
      # history 커밋 (weekly + benchmark 공용 sent history)
      # → weekly history: weekly.py가 매 실행 저장하므로 신규 파일이 있으면 add
      # → benchmark sent history: 발송 성공한 경우에만 send_report.py가 생성
      # ============================================================
      - name: history 커밋
        if: steps.biweekly.outputs.run == '1'
        env:
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
        run: |
          git config user.name "teoldeurim-bot"
          git config user.email "actions@github.com"
          # monday_recent 등 다른 workflow가 push한 커밋을 먼저 반영 (race 방지)
          git pull --rebase --autostash
          git add history/
          git add benchmark/history/sent/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "신규 history 파일 없음 (커밋 생략)"
          else
            # 커밋 메시지의 slot 날짜는 REPORT_DATE 우선. 비면 KST 오늘.
            slot="${REPORT_DATE:-$(TZ=Asia/Seoul date +%Y-%m-%d)}"
            git commit -m "history: ${slot} 격주 통합 리포트 (weekly + benchmark)"
            git push
            echo "✅ 커밋 완료 (slot=${slot})"
          fi
