name: 털어드림 최근 콘텐츠 리포트 (월·수·금)

# 2026-07-21 대표님 요청: 기존 매주 월요일 단독 → 월·수·금 주 3회 발송 확장.
# recent 프로파일 (조회수 5만~300만, 업로드 0~7일 이내, NEWEST 정렬) 로
# 참고 채널 기반 최근 콘텐츠 발굴.
#
# 실행 시각 (KST):
#   · 월요일 08:42
#   · 수요일 08:42
#   · 금요일 08:42  (2026-08-06 09:30 → 08:42 로 앞당김.
#                    같은 날 Standard 08:47 보다 5분 먼저 실행되며,
#                    concurrency group teoldeurim-mailer 로 순차 보장 —
#                    Standard 는 Recent 완료 후 큐에서 자동 시작)
#
# 파일명은 이 workflow 의 기존 이름(`monday_recent.yml`) 을 유지하되, 표시명·주석·
# step 명·history commit 메시지는 모두 "최근 콘텐츠 (recent)" 기준으로 명시.
# 내부 python 실행 --mode=monday 도 backward compatibility 상 그대로 유지.
on:
  schedule:
    - cron: '42 23 * * 0'   # 일요일 23:42 UTC = 월요일 08:42 KST
    - cron: '42 23 * * 2'   # 화요일 23:42 UTC = 수요일 08:42 KST
    - cron: '42 23 * * 4'   # 목요일 23:42 UTC = 금요일 08:42 KST
  workflow_dispatch:
    inputs:
      recipient_override:
        description: '(선택) 이번 실행만 이 주소로 발송 (검증용). 비면 기본 RECIPIENT_EMAIL 사용. 여러 명 지정 시 쉼표로.'
        type: string
        required: false
        default: ''
      exclude_top_n_views:
        description: '(선택) benchmark 에서 조회수 상위 N개 명시적 제외 (검증용, 예: 30). 비면 미적용.'
        type: string
        required: false
        default: ''

# weekly.yml (격주 금 standard) 와 같은 concurrency group 공유 —
# 금요일 순서: Recent(08:42) 먼저 실행 → 완료 후 Standard(08:47) 실행.
# → git push race 원천 차단 + 안전한 순차 실행 보장.
# (아래 pull --rebase --autostash 도 함께 유지해 이중 방어.)
concurrency:
  group: teoldeurim-mailer
  cancel-in-progress: false

jobs:
  send-recent-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # history/ 및 benchmark/history/sent/ 커밋 권한

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 시크릿 사전 검증
      # → recent 통합 리포트는 Weekly recent + Benchmark recent 함께 실행하므로
      #   YOUTUBE_API_KEY (Weekly)와 APIFY_TOKEN (Benchmark) 모두 필수
      # ============================================================
      - name: 시크릿 사전 검증
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set -e
          fail=0
          check() {
            if [ "$2" -eq 0 ]; then echo "❌ $1: 등록 안 됨"; fail=1
            else echo "✅ $1: 등록됨 (길이 $2)"; fi
          }
          check YOUTUBE_API_KEY ${#YOUTUBE_API_KEY}
          check APIFY_TOKEN ${#APIFY_TOKEN}
          check ANTHROPIC_API_KEY ${#ANTHROPIC_API_KEY}
          check GMAIL_ADDRESS ${#GMAIL_ADDRESS}
          check GMAIL_APP_PASSWORD ${#GMAIL_APP_PASSWORD}
          check RECIPIENT_EMAIL ${#RECIPIENT_EMAIL}
          if [ $fail -eq 1 ]; then
            echo "👉 Settings → Secrets에서 위 시크릿을 확인하세요."
            exit 1
          fi

      # ============================================================
      # orchestrator 실행 — mode=monday (내부 코드 backward compat; 실제로는 월·수·금 공용)
      # 내부: benchmark(PROFILE=recent) + weekly(WEEKLY_PROFILE=recent) 통합 shell
      # → 발송 성공 후:
      #     · benchmark/history/sent/YYYY-MM-DD_recent.json 자동 생성 (recent dedup 근거)
      #     · history/YYYY-MM-DD_recent.json 자동 생성 (Weekly cross-profile dedup 근거)
      # ============================================================
      - name: 오케스트레이터 실행 (recent 통합)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # recipient_override input 이 있으면 그 주소로만 발송 (검증용). 비면 기본 RECIPIENT_EMAIL.
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_override != '' && github.event.inputs.recipient_override || secrets.RECIPIENT_EMAIL }}
          # recipient_override 지정 시 자동으로 FORCE_RESCAN=1 — 이미 오늘자 history 가 있어도
          # 새 코드로 수집·분석을 다시 돌려야 override 실행의 의미가 있음.
          FORCE_RESCAN: ${{ github.event.inputs.recipient_override != '' && '1' || '' }}
          # 검증용: benchmark 에서 조회수 상위 N개 명시적 제외 (하위권 후보 확인 목적)
          EXCLUDE_TOP_N_VIEWS: ${{ github.event.inputs.exclude_top_n_views || '' }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/send_report.py --mode=monday

      # ============================================================
      # history 커밋 — Weekly recent history + benchmark 공용 sent history
      # → 발송 실패 시 각 파일 생성 자체가 안 됨. add 대상 없으면 조용히 pass.
      # → recent 파일명은 `YYYY-MM-DD_recent.json` 형식 (standard 의 RESEND_LATEST 에는
      #    자동 제외됨 — weekly.py 는 `\d{4}-\d{2}-\d{2}` fullmatch 로 recent 접미사 파일 제외).
      # → 금요일에는 앞선 standard(08:42) 의 push 를 pull --rebase 로 먼저 반영.
      # ============================================================
      - name: history 커밋
        # recipient_override 지정 실행은 검증용 test 발송이므로 history 를 origin/main 에
        # 커밋하지 않음. runner 임시 파일 시스템에만 남고 종료 시 사라짐.
        if: github.event.inputs.recipient_override == ''
        run: |
          git config user.name "teoldeurim-bot"
          git config user.email "actions@github.com"
          # 다른 workflow (weekly.yml standard 등) 가 push 한 커밋을 먼저 반영 (race 방지)
          git pull --rebase --autostash
          git add history/ 2>/dev/null || true
          git add benchmark/history/sent/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "신규 history 파일 없음 (커밋 생략)"
          else
            today=$(TZ=Asia/Seoul date +%Y-%m-%d)
            dow=$(TZ=Asia/Seoul date +%A)   # Monday / Wednesday / Friday 등
            git commit -m "history: ${today} (${dow}) 최근 콘텐츠 리포트 (recent)"
            git push
            echo "✅ 커밋 완료"
          fi
