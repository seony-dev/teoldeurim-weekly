name: 매주 금 Weekly Bundle (털어드림/묘한덕질)

# (2026-08-25 신설) 2 target(털어드림/묘한덕질) × mode=weekly 통합 리포트 · Gmail 1통 · 첨부 2개.
#   (신설 당시 3 target · 첨부 3개였으나 2026-11-11 짤덕방 제외)
#
# 실행 시각: 매주 금 08:17 KST = 목요일 23:17 UTC.
#   이전 monday_recent.yml 의 월/수/금 3회 실행은 사용자 지시로 금요일 1회로 변경.
#   (2026-08-28) GitHub Actions schedule 지연 가능성 대비 운영 여유 확보를 위해
#   08:42 → 08:17 로 25분 앞당김. 격주 Standard(weekly.yml) 도 08:47 → 08:23 으로 동시 이동.
#
# concurrency group teoldeurim-mailer 를 격주 금 Standard(weekly.yml, 08:23 KST) 와
# 공유해 큐 대기 → Weekly Bundle 완료 후 Standard 순차 실행. push race 완전 회피.
#
# 발송 규칙:
#   · 2 target 중 하나라도 실패하면 부분 첨부로 발송하지 않고 skip (raise).
#   · Gmail 발송 성공 후에만 각 target sent history 를 기록 (target namespace).
#   · recipient_override 지정 실행은 검증용 test 발송 — production sent history 를 오염시키지 않음.
#
# (2026-08-26 운영 전환) 2026-08-26 08:42 KST 임시 테스트 실행에서 메일 수신·첨부
# 정상 확인. RECIPIENT_EMAIL_SELF → RECIPIENT_EMAIL / TEST_MODE 제거 / 임시 수요일
# cron·날짜 guard 제거 완료.
# (2026-08-28) GitHub Actions schedule 지연 가능성 대비 운영 여유 확보를 위해
# 08:42 → 08:17 로 25분 앞당김.
# (2026-11-09) 정기 실행은 Cloud Scheduler(매주 금 09:10 KST) → Cloud Run Job
# teoldeurim-friday-prod 로 이전. schedule 트리거 제거. sent history 는 GCS prod/ 가 기준.
# 수동 실행(workflow_dispatch)은 Cloud Run 실행으로 이전되기 전까지 차단 (manual-guard).
# (2026-11-11) 짤덕방(jjalduk) Weekly Bundle 제외에 맞춰 name 에서 짤덕방 제거.
#   아래 보존용 job(if: false) 본문은 이전 정의 그대로 둠.
on:
  workflow_dispatch:
    inputs:
      recipient_override:
        description: '(선택) 이번 실행만 이 주소로 발송 (검증용). 비면 기본 RECIPIENT_EMAIL 사용.'
        type: string
        required: false
        default: ''
      report_date:
        description: '(선택) 리포트 slot 날짜 override — YYYY-MM-DD. 비면 실행 당일 KST.'
        type: string
        required: false
        default: ''
      notice:
        description: '(선택) 메일 본문 최상단 안내 문구. 리터럴 "\n" 은 개행 변환.'
        type: string
        required: false
        default: ''
      reissue:
        description: '(선택) subject 맨 앞에 "[재발송] " 접두어 추가'
        type: boolean
        default: false
      force_rescan:
        description: '(선택) 강제 재분석 (오늘자 filtered_raw 무시하고 새로 수집)'
        type: boolean
        default: false

concurrency:
  group: teoldeurim-mailer
  cancel-in-progress: false

jobs:
  # 수동 실행 차단 — 리포트 생성·메일 발송 없이 안내 후 실패 처리.
  manual-guard:
    runs-on: ubuntu-latest
    steps:
      - name: 수동 실행 차단 안내
        run: |
          echo "::error::Production execution migrated to Cloud Run — manual GitHub execution temporarily disabled"
          echo "정기 실행: Cloud Scheduler(매주 금 09:10 KST) → Cloud Run Job teoldeurim-friday-prod"
          echo "수동 실행이 필요하면 Cloud Run Job 을 직접 execute 하세요 (GitHub → Cloud Run 이전 작업 예정)."
          exit 1

  # 기존 정의는 Cloud Run 수동 실행 이전 작업의 참고용으로 보존. 실행되지 않음.
  send-weekly-bundle:
    needs: manual-guard
    if: ${{ false }}
    runs-on: ubuntu-latest
    # 3 target 순차 실행 · 각 target Apify discovery+detail 호출 · Claude 분석 포함.
    # 참고 채널 총합 = 털어드림 7 + 묘한덕질 6 + 짤덕방 3 = 16 개 (× 채널당 50 raw).
    # (2026-08-25 실측 · 4 profile E2E DRY_RUN)
    #   · 털어드림 Weekly: 15.5분 · 묘한덕질 Weekly: 9.1분 · 짤덕방 Weekly: 5.7분
    #   → 순차 실행 합계 ~30.3분. 기준 "실측 30분 근접/초과 시 60분 상향" 에 해당 →
    #     timeout 40 → 60 상향. 외부 API 지연·재시도 여유 확보.
    # (Standard weekly.yml 은 실측 ~16분 단독 실행이라 40분 유지)
    timeout-minutes: 60

    permissions:
      contents: write   # benchmark/history/sent/{target}/ 커밋 권한

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 시크릿 사전 검증
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set -e
          fail=0
          check() {
            if [ "$2" -eq 0 ]; then echo "❌ $1: 등록 안 됨"; fail=1
            else echo "✅ $1: 등록됨 (길이 $2)"; fi
          }
          check APIFY_TOKEN ${#APIFY_TOKEN}
          check ANTHROPIC_API_KEY ${#ANTHROPIC_API_KEY}
          check GMAIL_ADDRESS ${#GMAIL_ADDRESS}
          check GMAIL_APP_PASSWORD ${#GMAIL_APP_PASSWORD}
          check RECIPIENT_EMAIL ${#RECIPIENT_EMAIL}
          if [ $fail -eq 1 ]; then
            echo "👉 Settings → Secrets 에서 시크릿을 확인하세요."
            exit 1
          fi

      - name: Weekly Bundle 실행 (--mode=weekly-bundle)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # 운영: production 수신자. recipient_override 는 workflow_dispatch 로만 검증용.
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_override != '' && github.event.inputs.recipient_override || secrets.RECIPIENT_EMAIL }}
          FORCE_RESCAN: ${{ github.event.inputs.force_rescan == 'true' && '1' || '' }}
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
          NOTICE: ${{ github.event.inputs.notice || '' }}
          REISSUE: ${{ github.event.inputs.reissue == 'true' && '1' || '' }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/send_report.py --mode=weekly-bundle

      - name: sent history 커밋 (3 target namespace)
        # recipient_override 지정 실행은 검증용 → sent history 커밋 skip.
        if: github.event.inputs.recipient_override == ''
        run: |
          git config user.name "teoldeurim-bot"
          git config user.email "actions@github.com"
          # 격주 Standard workflow 등이 push 한 커밋을 먼저 반영 (race 방지)
          git pull --rebase --autostash
          # 3 target namespace 각각 add. 부분 발송이 없으므로 3개 모두 함께 커밋 or 모두 없음.
          git add benchmark/history/sent/teoldeurim/ 2>/dev/null || true
          git add benchmark/history/sent/myohanduk/ 2>/dev/null || true
          git add benchmark/history/sent/jjalduk/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "신규 sent history 파일 없음 (커밋 생략)"
          else
            today=$(TZ=Asia/Seoul date +%Y-%m-%d)
            git commit -m "history: ${today} Weekly Bundle sent (털어드림/묘한덕질/짤덕방)"
            git push
            echo "✅ 커밋 완료"
          fi
