name: 털어드림 격주 Benchmark Standard (금요일)

# 매주 금요일 08:23 KST = 매주 목요일 23:23 UTC — 격주(ISO 홀수 주차) 만 실행.
#   (2026-08-28) GitHub Actions schedule 지연 가능성 대비 운영 여유 확보를 위해
#   08:47 → 08:23 으로 24분 앞당김. Weekly Bundle(weekly_bundle.yml) 도 08:42 → 08:17
#   로 동시 이동.
#   같은 날 Weekly Bundle(08:17) 이 먼저 실행되며 concurrency group teoldeurim-mailer
#   로 큐 대기 → Bundle 완료 후 Standard 순차 실행. 두 워크플로 사이 push race 완전 회피.
#
# (2026-08-25 리팩터링) send_report.py --mode=friday 는 이제 target=teoldeurim +
# mode=standard 를 명시적으로 넘겨 benchmark.py 를 호출. 신규 sent history 는
# benchmark/history/sent/teoldeurim/*.json namespace 에 저장됨.
on:
  schedule:
    - cron: '23 23 * * 4'   # 목요일 23:23 UTC = 금요일 08:23 KST
  workflow_dispatch:
    inputs:
      force_rescan:
        description: '강제 재분석 (오늘자 history 무시하고 새로 수집·분석)'
        type: boolean
        default: false
      report_date:
        description: '(선택) 리포트 slot 날짜 override — YYYY-MM-DD. 비면 실행 당일 KST. 예: 2026-07-17 (금요일 발송 예정이었으나 놓친 날짜 재발송용). 파일명·subject·history namespace 만 이 값으로 저장되며, age 계산·수집·generated_at 은 실제 실행 시각(KST 오늘) 유지.'
        type: string
        required: false
        default: ''
      notice:
        description: '(선택) 메일 본문 최상단 안내 문구. 리터럴 "\n" 은 개행으로 변환. HTML escape 후 안내 박스로 노출. 빈 값이면 미노출.'
        type: string
        required: false
        default: ''
      reissue:
        description: '(선택) subject 맨 앞에 "[재발송] " 접두어 추가'
        type: boolean
        default: false

# 동시 실행 방지 — monday_recent.yml 과 같은 group 을 공유해 push race 완전 회피.
# (2026-07-21: 월·수·금 recent 확장 대응. 조건·일정·판정은 일체 변경 없음.)
concurrency:
  group: teoldeurim-mailer
  cancel-in-progress: false

jobs:
  send-friday-integrated:
    runs-on: ubuntu-latest
    # (2026-08-24) Weekly 제거로 benchmark 실행 시간 ~14분 (당시 22채널·Claude 30 상한)이
    # 유일한 실행. Recent 워크플로와 동일하게 40분으로 안전 마진 확보.
    # (2026-08-25) 참고 채널 22 → 3개로 축소되어 시간 대폭 감소 예상. 새 채널 추가 예정
    # 이므로 40분 여유 그대로 유지.
    timeout-minutes: 40

    permissions:
      contents: write   # history/, benchmark/history/sent/ 커밋 권한

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 격주 판별 — KST 금요일 기준 ISO 주차로 홀수/짝수 판단
      # - 홀수 주차: 발송 (run=1)
      # - 짝수 주차: 스킵 (run="")
      # - 단, workflow_dispatch (수동 실행)은 항상 통과
      # ============================================================
      - name: 격주 판별 (KST ISO 주차)
        id: biweekly
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "✅ 수동 실행 (workflow_dispatch) — 격주 스킵 무시하고 진행"
          else
            week=$(TZ=Asia/Seoul date +%V)
            echo "현재 KST ISO 주차: $week"
            if [ $((10#$week % 2)) -eq 1 ]; then
              echo "run=1" >> "$GITHUB_OUTPUT"
              echo "✅ 홀수 주차 ($week) — 격주 발송일"
            else
              echo "run=" >> "$GITHUB_OUTPUT"
              echo "⏭️  짝수 주차 ($week) — 격주 스킵 (다음 주 발송)"
            fi
          fi

      # ============================================================
      # 시크릿 사전 검증
      # → (2026-08-24) Weekly 제거로 YOUTUBE_API_KEY 는 실행 경로에서 미사용.
      # → (2026-08-26) 운영 전환. RECIPIENT_EMAIL 사용.
      # ============================================================
      - name: 시크릿 사전 검증
        if: steps.biweekly.outputs.run == '1'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set -e
          fail=0
          check() {
            if [ "$2" -eq 0 ]; then echo "❌ $1: 등록 안 됨"; fail=1
            else echo "✅ $1: 등록됨 (길이 $2)"; fi
          }
          check APIFY_TOKEN ${#APIFY_TOKEN}
          check ANTHROPIC_API_KEY ${#ANTHROPIC_API_KEY}
          check GMAIL_ADDRESS ${#GMAIL_ADDRESS}
          check GMAIL_APP_PASSWORD ${#GMAIL_APP_PASSWORD}
          check RECIPIENT_EMAIL ${#RECIPIENT_EMAIL}
          if [ $fail -eq 1 ]; then
            echo ""
            echo "👉 GitHub 레포의 Settings → Secrets and variables → Actions"
            echo "   에서 위 5개 시크릿이 정확한 이름으로 등록됐는지 확인하세요."
            exit 1
          fi

      # ============================================================
      # orchestrator 실행 (mode=friday)
      # → benchmark(target=teoldeurim, mode=standard) 단독 실행 후 HTML 그대로 발송.
      # → 발송 성공 후:
      #     · benchmark/history/sent/teoldeurim/YYYY-MM-DD_standard.json 자동 생성
      # ============================================================
      - name: 오케스트레이터 실행 (mode=friday)
        if: steps.biweekly.outputs.run == '1'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_RESCAN: ${{ github.event.inputs.force_rescan == 'true' && '1' || '' }}
          # REPORT_DATE / NOTICE / REISSUE — workflow_dispatch 로 넘어온 값. cron / 기본 실행은 모두 빈 값 → 기존 동작.
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
          NOTICE: ${{ github.event.inputs.notice || '' }}
          REISSUE: ${{ github.event.inputs.reissue == 'true' && '1' || '' }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/send_report.py --mode=friday

      # ============================================================
      # sent history 커밋 (target namespace 만)
      # → 신규 저장 위치: benchmark/history/sent/teoldeurim/*.json
      # → 발송 성공한 경우에만 send_report.py 가 파일 생성.
      # ============================================================
      - name: sent history 커밋
        if: steps.biweekly.outputs.run == '1'
        env:
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
        run: |
          git config user.name "teoldeurim-bot"
          git config user.email "actions@github.com"
          # weekly_bundle.yml 이 먼저 push 한 커밋을 반영 (race 방지)
          git pull --rebase --autostash
          git add benchmark/history/sent/teoldeurim/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "신규 sent history 파일 없음 (커밋 생략)"
          else
            slot="${REPORT_DATE:-$(TZ=Asia/Seoul date +%Y-%m-%d)}"
            git commit -m "history: ${slot} 격주 Standard sent (teoldeurim)"
            git push
            echo "✅ 커밋 완료 (slot=${slot})"
          fi
