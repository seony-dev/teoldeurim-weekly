name: 털어드림 주간 후보 메일링

# 매주 금요일 09:00 KST = 매주 금요일 00:00 UTC
on:
  schedule:
    - cron: '0 0 * * 5'   # 분 시 일 월 요일 (UTC 기준, 5=금요일)
  # 수동 실행도 가능 (Actions 탭에서 "Run workflow" 버튼)
  workflow_dispatch:

# 동시 실행 방지 (같은 시각 재실행 방지)
concurrency:
  group: weekly-mailer
  cancel-in-progress: false

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # history 파일 커밋 권한

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 시크릿 사전 검증 (이전 작업의 invalid x-api-key 함정 방지)
      # 키 길이만 출력. 실제 값은 마스킹돼 노출 안 됨.
      # ============================================================
      - name: 시크릿 사전 검증
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          fail=0
          check() {
            local name="$1" len="$2"
            if [ "$len" -eq 0 ]; then
              echo "❌ $name: 등록 안 됨 또는 빈 값"
              fail=1
            else
              echo "✅ $name: 등록됨 (길이 $len)"
            fi
          }
          check YOUTUBE_API_KEY ${#YOUTUBE_API_KEY}
          check GMAIL_ADDRESS ${#GMAIL_ADDRESS}
          check GMAIL_APP_PASSWORD ${#GMAIL_APP_PASSWORD}
          check RECIPIENT_EMAIL ${#RECIPIENT_EMAIL}
          check ANTHROPIC_API_KEY ${#ANTHROPIC_API_KEY}
          if [ $fail -eq 1 ]; then
            echo ""
            echo "👉 GitHub 레포의 Settings → Secrets and variables → Actions"
            echo "   에서 위 5개 시크릿이 정확한 이름으로 등록됐는지 확인하세요."
            echo "   (이름은 대소문자·언더스코어까지 정확히 일치해야 합니다)"
            exit 1
          fi

      - name: 주간 잡 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/weekly.py

      # ============================================================
      # history 파일이 새로 생성됐으면 자동 커밋
      # ============================================================
      - name: history 커밋
        run: |
          git config user.name "teoldeurim-bot"
          git config user.email "actions@github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "신규 history 파일 없음 (커밋 생략)"
          else
            today=$(TZ=Asia/Seoul date +%Y-%m-%d)
            git commit -m "history: ${today} 주간 후보 아카이브"
            git push
            echo "✅ 커밋 완료"
          fi
