name: 털어드림 주간 후보 메일링

# 매주 금요일 08:42 KST = 매주 목요일 23:42 UTC
# (GitHub Actions schedule이 정각·10분 단위에서 시작 지연 큼 → 회피용 오프셋)
on:
  schedule:
    - cron: '42 23 * * 4'   # 분 시 일 월 요일 (UTC 기준, 4=목요일)
  # 수동 실행 (Actions 탭에서 "Run workflow" 버튼)
  workflow_dispatch:
    inputs:
      force_rescan:
        description: '강제 재분석 (오늘자 history 무시하고 새로 수집·분석)'
        type: boolean
        default: false

# 동시 실행 방지 (같은 시각 재실행 방지)
concurrency:
  group: weekly-mailer
  cancel-in-progress: false

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # benchmark ~7분 + weekly ~3-5분 + 안전 마진

    permissions:
      contents: write   # history 파일 커밋 권한

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 시크릿 사전 검증 (이전 작업의 invalid x-api-key 함정 방지)
      # 키 길이만 출력. 실제 값은 마스킹돼 노출 안 됨.
      # APIFY_TOKEN은 옵션 (benchmark용) — 별도 step에서 부드럽게 체크
      # ============================================================
      - name: 시크릿 사전 검증
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          fail=0
          check() {
            local name="$1" len="$2"
            if [ "$len" -eq 0 ]; then
              echo "❌ $name: 등록 안 됨 또는 빈 값"
              fail=1
            else
              echo "✅ $name: 등록됨 (길이 $len)"
            fi
          }
          check YOUTUBE_API_KEY ${#YOUTUBE_API_KEY}
          check GMAIL_ADDRESS ${#GMAIL_ADDRESS}
          check GMAIL_APP_PASSWORD ${#GMAIL_APP_PASSWORD}
          check RECIPIENT_EMAIL ${#RECIPIENT_EMAIL}
          check ANTHROPIC_API_KEY ${#ANTHROPIC_API_KEY}
          if [ $fail -eq 1 ]; then
            echo ""
            echo "👉 GitHub 레포의 Settings → Secrets and variables → Actions"
            echo "   에서 위 5개 시크릿이 정확한 이름으로 등록됐는지 확인하세요."
            echo "   (이름은 대소문자·언더스코어까지 정확히 일치해야 합니다)"
            exit 1
          fi

      # ============================================================
      # 보조 모듈: 타 채널 벤치마크 (Apify + Claude)
      # - APIFY_TOKEN 없으면 step 자체 스킵 (weekly는 정상 진행)
      # - 실행 실패해도 weekly 발송 막지 않음 (continue-on-error)
      # - 산출물: benchmark/YYYY-MM-DD_report.html — weekly가 두 번째 첨부로 사용
      # ============================================================
      - name: Apify 토큰 존재 확인 (옵션)
        id: apify_check
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -n "$APIFY_TOKEN" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "✅ APIFY_TOKEN 등록됨 — 벤치마크 step 실행"
          else
            echo "ok=" >> "$GITHUB_OUTPUT"
            echo "⚠️ APIFY_TOKEN 미등록 — 벤치마크 step 스킵 (weekly는 정상 진행)"
          fi

      - name: 벤치마크 보조 리포트 실행
        if: steps.apify_check.outputs.ok == '1'
        continue-on-error: true   # 실패해도 weekly 발송 막지 않음
        timeout-minutes: 12
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/benchmark.py

      - name: 벤치마크 리포트 경로 탐색
        id: find_benchmark
        run: |
          if compgen -G "benchmark/*_report.html" > /dev/null; then
            report=$(ls -t benchmark/*_report.html | head -1)
            echo "path=$report" >> "$GITHUB_OUTPUT"
            echo "✅ benchmark report 발견 — weekly 두 번째 첨부 대상: $report"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "⚠️ benchmark report not attached — file missing (weekly는 정상 진행)"
          fi

      - name: 주간 잡 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # workflow_dispatch에서 force_rescan=true 체크하면 1로 전달, 아니면 빈 값
          FORCE_RESCAN: ${{ github.event.inputs.force_rescan == 'true' && '1' || '' }}
          # 벤치마크 step에서 찾은 HTML 경로 (없으면 빈 값 → weekly는 단일 첨부로 fallback)
          BENCHMARK_REPORT_PATH: ${{ steps.find_benchmark.outputs.path }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/weekly.py

      # ============================================================
      # history 파일이 새로 생성됐으면 자동 커밋
      # ============================================================
      - name: history 커밋
        run: |
          git config user.name "teoldeurim-bot"
          git config user.email "actions@github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "신규 history 파일 없음 (커밋 생략)"
          else
            today=$(TZ=Asia/Seoul date +%Y-%m-%d)
            git commit -m "history: ${today} 주간 후보 아카이브"
            git push
            echo "✅ 커밋 완료"
          fi
